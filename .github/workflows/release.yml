name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # abi3 means one wheel per target, with no Python-version axis.
  linux:
    name: wheel linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i 3.10
          manylinux: auto
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: wheel macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheel windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  verify:
    name: verify wheel py${{ matrix.python-version }} ${{ matrix.os }}
    needs: [linux, macos, windows, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Metadata renders
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*
      - name: Install and smoke test
        shell: bash
        run: |
          python -m pip install --only-binary :all: --no-index --find-links dist rusty-faker
          python -c "import rusty_faker; print(rusty_faker.__version__); print(rusty_faker.Faker().name())"
          python -m pip install "pytest>=8"
          python -m pytest tests/compat/test_behavior.py -q

  verify-sdist:
    name: verify sdist builds from source
    needs: [sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: wheels-sdist
          path: dist
      - name: sdist must carry build.rs and the data tables
        run: |
          tar tzf dist/*.tar.gz | grep -q 'rusty-faker-core/build.rs'
          tar tzf dist/*.tar.gz | grep -q 'rusty-faker-core/data/en_US/person.json'
      - name: Build and install from sdist
        run: |
          python -m pip install --no-binary :all: dist/*.tar.gz
          python -c "import rusty_faker; print(rusty_faker.Faker().address())"

  publish:
    name: publish to PyPI
    # Disabled until you turn it on. To enable:
    #   1. On PyPI, add a pending Trusted Publisher: project rusty-faker, owner
    #      j-rasmussen, repository rusty-faker, workflow release.yml, environment pypi.
    #   2. Create the GitHub environment "pypi" (a required reviewer is worth it).
    #   3. Set the repository variable PYPI_PUBLISH_ENABLED to true.
    #   4. Push a v* tag. An unset variable evaluates false, so nothing publishes
    #      before then, and workflow_dispatch can never publish.
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [verify, verify-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rusty-faker
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
