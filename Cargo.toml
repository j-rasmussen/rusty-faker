[workspace]
resolver = "3"
members = ["crates/rusty-faker-core", "crates/rusty-faker-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
rusty-faker-core = { path = "crates/rusty-faker-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
deunicode = "1.6.2"
pyo3 = { version = "0.29.2", features = ["chrono"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "sys_rng"] }
rand_pcg = "0.10.2"
serde_json = "1.0.151"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
